<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokedex</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <main>
        <div class="contenedor-principal">
            <div class="encabezado-pagina">
                <div id="logo">
                <img src="img/International_Pokémon_logo.svg" alt="logo pokemon">
                </div>   
                <div class="titulo-encabezado">
                    <h2 id="titulo">Explora y guarda tus pokémon</h2>
                    <h3 id="subtitulo">Busca un pokémon, explora su informacion y guárdalo en tu lista.</h3>
                </div>
            </div><!-- Cierre class encabezado pagina -->
            <div class="barra-busqueda">
                     <input id="barra-b" type="text" placeholder="Buscar..." >
                     <button id="btn-buscar" type="submit">Buscar</button>
                
            </div><!-- Cierre class barra de busqueda -->
            <div class="info">
                <p id="mensaje"></p>
            </div>
            
            <div class="contendor-cartas">
                   
            
            </div><!-- Cierre class cartas -->
            <div id="pokemones-guardados">


            </div><!-- Cierre class pokemones-guardados -->
        </div> <!-- Cierre class contenedor principal-->


    </main>

    <script src="js/app.js"></script>
</body>
</html>
